{% set cfg = component.config %}
{% set state = component.state %}
{% set output = component.output %}
{% set list_state = state["list"] %}
{% set selected = output.get("selected") %}
<div class="dix-component" data-component="{{ component.id }}" data-use="{{ component.use }}" data-interaction="{{ component.interaction.role }}">
  <label for="{{ component.id }}">{{ cfg.get("label", component.id) }}</label>
  <select
    id="{{ component.id }}"
    name="selected"
    {% if cfg.get("mode") == "multi" %}multiple{% endif %}
    hx-post="{{ component.update_url }}"
    hx-trigger="change"
    hx-target="#component-{{ component.id }}"
    hx-swap="outerHTML"
  >
    <option value="">-- choose --</option>
    {% for item in list_state["items"] %}
      {% set is_selected = (selected is sequence and selected is not string and item["id"] in selected) or selected == item["id"] %}
      <option value="{{ item['id'] }}" {% if is_selected %}selected{% endif %}>{{ item.get("label", item["id"]) }}</option>
    {% endfor %}
  </select>
</div>
