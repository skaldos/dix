<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { color-scheme: light dark; --gap: 1rem; --border: #8885; }
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    .dix-component { border: 1px solid var(--border); border-radius: .5rem; padding: 1rem; margin: 1rem 0; }
    label { display: block; font-weight: 600; margin-bottom: .35rem; }
    input, select { min-width: 20rem; padding: .45rem; }
    pre { background: #8881; padding: 1rem; overflow: auto; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
