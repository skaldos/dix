[app]
id = "navigation_group"

[apps.basic]
use = "dix/sway/navigation_basic"

[compositions.active_members]
use = "dix/sway/active_members"

[compositions.ipc]
use = "dix/sway/ipc"

[functions.left]
description = "Move left to the next live member of the active Sway group."

[functions.right]
description = "Move right to the next live member of the active Sway group."

[functions.up]
description = "Move up to the next live member of the active Sway group."

[functions.down]
description = "Move down to the next live member of the active Sway group."
