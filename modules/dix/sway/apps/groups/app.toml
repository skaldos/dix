[app]
id = "groups"

[compositions.groups]
use = "dix/sway/groups"

[functions.create]
description = "Create one empty named Sway container group."
export = "groups.create"

[functions.add]
description = "Add the currently focused Sway container to a group."
export = "groups.add"

[functions.remove]
description = "Remove the currently focused Sway container from a group."
export = "groups.remove"

[functions.show]
description = "Show the members of one Sway container group."
export = "groups.show"

[functions.list]
description = "List all manually managed Sway container groups."
export = "groups.list"
