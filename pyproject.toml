[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dix"
version = "0.1.0"
description = "Declarative Interface eXecutor"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "dix contributors" }]
dependencies = []

[project.optional-dependencies]
cli = [
  "click>=8.1,<9",
  "typer>=0.27,<0.28",
]
state = [
  "pydantic>=2,<3",
]
roba = [
  "roba>=0.1.0",
  "click>=8.1,<9",
  "typer>=0.27,<0.28",
  "pydantic>=2,<3",
]
sway = [
  "i3ipc==2.2.1",
  "roba>=0.1.0",
  "click>=8.1,<9",
  "typer>=0.27,<0.28",
  "pydantic>=2,<3",
]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dix"]

[tool.hatch.build.targets.wheel.force-include]
"modules" = "dix/_modules"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.uv.sources]
roba = { path = "../roba", editable = true }
