[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dix"
version = "0.1.0"
description = "Declarative Interface eXecutor"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "dix contributors" }]
dependencies = [
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dix = "dix.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
