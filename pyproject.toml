[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dix"
version = "0.1.0"
description = "Declarative Interface eXecutor"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Matthias Fulz", email = "dev@skaldos.dev" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/skaldos/dix"
Documentation = "https://dix.skaldos.dev"
Repository = "https://github.com/skaldos/dix"
Issues = "https://github.com/skaldos/dix/issues"

[project.optional-dependencies]
cli = [
  "click>=8.1,<9",
  "typer>=0.27,<0.28",
]
state = [
  "pydantic>=2,<3",
]
roba = [
  "roba>=0.1.0",
  "click>=8.1,<9",
  "typer>=0.27,<0.28",
  "pydantic>=2,<3",
]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dix"]

[tool.hatch.build.targets.wheel.force-include]
"modules" = "dix/_modules"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.uv.sources]
roba = { path = "../roba", editable = true }
