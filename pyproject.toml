[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dix"
version = "0.1.0"
description = "Declarative Interface eXecutor"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "dix contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
