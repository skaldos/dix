[interface]
id = "demo_request"
title = "Demo Request"
description = "Small foundation demo for input/select state updates."
access = { mode = "public" }

[[components]]
id = "request_title"
use = "input"
config = { label = "Title", placeholder = "Short request title", required = true }

[[components]]
id = "request_kind"
use = "select"
config = { label = "Kind", mode = "single", options = [
  { id = "access", label = "Access" },
  { id = "hardware", label = "Hardware" },
  { id = "other", label = "Other" },
] }
