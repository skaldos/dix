[interface]
id = "demo_datamodel"
title = "Demo Datamodel"
description = "Headless datamodel capability exposed through one interface function."
access = { mode = "public" }

[[compositions]]
id = "data"
use = "dix/examples/files/datamodel_files"
config = { model_path = "../models/demo_user.toml", data_path = "../data/demo_user.json" }

[[functions]]
id = "run"
call = "data.run"
